<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning News Trimestrielles 2027</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:12px;background:#f0f2f5}

/* ── PIN ── */
#pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000}
#pin-box{background:#fff;padding:36px 44px;border-radius:12px;text-align:center;min-width:300px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
#pin-box h2{color:#6E3FA3;margin-bottom:6px;font-size:18px}
#pin-box p{color:#666;margin-bottom:18px;font-size:13px}
#pin-input{font-size:28px;letter-spacing:10px;width:130px;text-align:center;border:2px solid #ccc;border-radius:8px;padding:8px 12px;margin-bottom:14px;outline:none}
#pin-input:focus{border-color:#6E3FA3}
#pin-btn{background:#6E3FA3;color:#fff;border:none;padding:10px 32px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}
#pin-btn:hover{background:#8b52c5}
#pin-err{color:#c0392b;margin-top:10px;font-size:13px;min-height:18px}

/* ── HEADER ── */
#header{background:#6E3FA3;color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#header h1{font-size:15px;font-weight:bold}
#header-right{display:flex;align-items:center;gap:10px}
#agent-badge{background:#FFD966;color:#1E3A6E;padding:4px 14px;border-radius:20px;font-weight:bold;font-size:12px}
#refresh-btn{background:#27ae60;color:#fff;border:none;padding:6px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold}

/* ── TABS ── */
#tabs{display:flex;background:#e0d5f0;border-bottom:3px solid #6E3FA3;padding:0 18px;overflow-x:auto}
.tab{padding:8px 16px;cursor:pointer;font-weight:bold;font-size:11px;border-radius:5px 5px 0 0;margin-right:3px;margin-top:5px;color:#555;white-space:nowrap}
.tab.active{background:#6E3FA3;color:#fff}
.tab:not(.active):hover{background:#c9b5e0}

/* ── TABLE ── */
#content{padding:10px 14px;overflow-x:auto}
#content h2{font-size:13px;padding:6px 0 8px;font-weight:bold}
#content h3{font-size:12px;padding:10px 0 4px;color:#888}
table{border-collapse:collapse;font-size:11px;width:100%;min-width:900px;margin-bottom:18px}
th{padding:5px 4px;text-align:center;border:1px solid #555;white-space:nowrap;position:sticky;top:56px;z-index:5;color:#fff}
th.sv-textes{background:#FFC000;color:#000}
th.sv-epreuve{background:#70AD47;color:#000}
th.sv-coupon{background:#00B0F0;color:#000}
th.sv-rem{background:#595959;color:#fff}
td{border:1px solid #ddd;padding:3px 4px;vertical-align:middle}
tr:nth-child(even) td{background:#f7f7f7}
tr:nth-child(odd) td{background:#fff}
td.num{text-align:center}
td.right{text-align:right}
td.nm{font-weight:bold;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.suivi{padding:2px}
td.suivi input,td.suivi select{width:100%;font-size:10px;font-weight:bold;padding:2px 3px;border:1px solid #bbb;border-radius:3px;background:#fefde8}
tfoot td{font-weight:bold;border-color:#555}

#status{position:fixed;bottom:0;left:0;right:0;background:#6E3FA3;color:#d9c4f5;padding:3px 12px;font-size:11px;text-align:right}
/* ── LOADING DIALOG ── */
#loading-dialog{border:3px solid #6E3FA3;border-radius:14px;padding:36px 60px;font-size:20px;font-weight:bold;color:#6E3FA3;box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center;min-width:300px;line-height:1.8;background:#fff;margin:auto}
#loading-dialog::backdrop{background:rgba(0,0,0,.50)}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin-overlay">
  <div id="pin-box">
    <h2>🔒 Planning News Trimestrielles</h2>
    <p>Entrez votre code PIN (4 chiffres)</p>
    <input id="pin-input" type="password" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="••••"><br>
    <button id="pin-btn" onclick="checkPin()">Connexion</button>
    <div id="pin-err"></div>
    <div style="margin-top:8px;font-size:11px;color:#aaa">Tentative <span id="pin-tries">1</span> / 3</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div id="header">
    <h1>📋 Planning News Trimestrielles</h1>
    <div id="header-right">
      <span id="agent-badge"></span>
      <button id="save-btn" onclick="saveAll()" style="background:#e67e22;color:#fff;border:none;padding:6px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold;margin-right:4px">💾 Enregistrer</button>
      <button id="refresh-btn" onclick="loadData()">↺ Mettre à jour</button>
    </div>
  </div>
  <div id="tabs"></div>
  <div id="content"><p style="padding:20px;color:#888">Chargement…</p></div>
</div>

<dialog id="loading-dialog"><span id="msg-box"></span></dialog>
<div id="status">Prêt</div>

<script>
const TK       = "pat2HkJhQsqj6clFJ.a1fb4a3a4d51f8f7e57d4eca2a0c633051bd89b80b90c2edbf66e93ed5657bcd";
const BASE     = "appixzcrs5T5kRQ36";
const TABLE_ID = "tblMiiIYVibfpe0L3";
const SF       = "SUIVI_NEWS";

const AGENTS = {"1111":"MARC","4444":"VANESSA","3333":"ANTOINE"};

const EDITIONS = [
  {num:"N°5",  label:"N°5 - Sept 2026",  periode:"SEPT-OCT-NOV 2026",   color:"#1B5E20",
   cb_b:"NEWS BELUX N3",  cb_f:"NEWS FRANCE N3",
   nbr_b:"NEWS BELUX N3 NBR",  fmt_b:"NEWS BELUX N3 FORMAT",  prix_b:"NEWS BELUX N3 PRIX",  crd_b:"NEWS BELUX N3 CREDIT",  tot_b:"NEWS BELUX N3 TOTAL",
   nbr_f:"NEWS FRANCE N3 NBR", fmt_f:"NEWS FRANCE N3 FORMAT", prix_f:"NEWS FRANCE N3 PRIX", crd_f:"NEWS FRANCE N3 CREDIT", tot_f:"NEWS FRANCE N3 TOTAL"},
  {num:"N°6",  label:"N°6 - Déc 2026",   periode:"DÉC-JAN-FÉV 2026/27", color:"#1A237E",
   cb_b:"NEWS BELUX N4",  cb_f:"NEWS FRANCE N4",
   nbr_b:"NEWS BELUX N4 NBR",  fmt_b:"NEWS BELUX N4 FORMAT",  prix_b:"NEWS BELUX N4 PRIX",  crd_b:"NEWS BELUX N4 CREDIT",  tot_b:"NEWS BELUX N4 TOTAL",
   nbr_f:"NEWS FRANCE N4 NBR", fmt_f:"NEWS FRANCE N4 FORMAT", prix_f:"NEWS FRANCE N4 PRIX", crd_f:"NEWS FRANCE N4 CREDIT", tot_f:"NEWS FRANCE N4 TOTAL"},
  {num:"N°7",  label:"N°7 - Mars 2027",  periode:"MARS-AVR-MAI 2027",   color:"#880E4F",
   cb_b:"NEWS BELUX N5",  cb_f:"NEWS FRANCE N5",
   nbr_b:"NEWS BELUX N5 NBR",  fmt_b:"NEWS BELUX N5 FORMAT",  prix_b:"NEWS BELUX N5 PRIX",  crd_b:"NEWS BELUX N5 CREDIT",  tot_b:"NEWS BELUX N5 TOTAL",
   nbr_f:"NEWS FRANCE N5 NBR", fmt_f:"NEWS FRANCE N5 FORMAT", prix_f:"NEWS FRANCE N5 PRIX", crd_f:"NEWS FRANCE N5 CREDIT", tot_f:"NEWS FRANCE N5 TOTAL"},
  {num:"N°8",  label:"N°8 - Juin 2027",  periode:"JUIN-JUIL-AOÛT 2027", color:"#006064",
   cb_b:"NEWS BELUX N6",  cb_f:"NEWS FRANCE N6",
   nbr_b:"NEWS BELUX N6 NBR",  fmt_b:"NEWS BELUX N6 FORMAT",  prix_b:"NEWS BELUX N6 PRIX",  crd_b:"NEWS BELUX N6 CREDIT",  tot_b:"NEWS BELUX N6 TOTAL",
   nbr_f:"NEWS FRANCE N6 NBR", fmt_f:"NEWS FRANCE N6 FORMAT", prix_f:"NEWS FRANCE N6 PRIX", crd_f:"NEWS FRANCE N6 CREDIT", tot_f:"NEWS FRANCE N6 TOTAL"},
  {num:"N°9",  label:"N°9 - Sept 2027",  periode:"SEPT-OCT-NOV 2027",   color:"#BF360C",
   cb_b:"NEWS BELUX N7",  cb_f:"NEWS FRANCE N7",
   nbr_b:"NEWS BELUX N7 NBR",  fmt_b:"NEWS BELUX N7 FORMAT",  prix_b:"NEWS BELUX N7 PRIX",  crd_b:"NEWS BELUX N7 CREDIT",  tot_b:"NEWS BELUX N7 TOTAL",
   nbr_f:"NEWS FRANCE N7 NBR", fmt_f:"NEWS FRANCE N7 FORMAT", prix_f:"NEWS FRANCE N7 PRIX", crd_f:"NEWS FRANCE N7 CREDIT", tot_f:"NEWS FRANCE N7 TOTAL"},
  {num:"N°10", label:"N°10 - Déc 2027",  periode:"DÉC-JAN-FÉV 2027/28", color:"#3E2723",
   cb_b:"NEWS BELUX N8",  cb_f:"NEWS FRANCE N8",
   nbr_b:"NEWS BELUX N8 NBR",  fmt_b:"NEWS BELUX N8 FORMAT",  prix_b:"NEWS BELUX N8 PRIX",  crd_b:"NEWS BELUX N8 CREDIT",  tot_b:"NEWS BELUX N8 TOTAL",
   nbr_f:"NEWS FRANCE N8 NBR", fmt_f:"NEWS FRANCE N8 FORMAT", prix_f:"NEWS FRANCE N8 PRIX", crd_f:"NEWS FRANCE N8 CREDIT", tot_f:"NEWS FRANCE N8 TOTAL"},
  {num:"N°11", label:"N°11 - Mars 2028", periode:"MARS-AVR-MAI 2028",   color:"#263238",
   cb_b:"NEWS BELUX N9",  cb_f:"NEWS FRANCE N9",
   nbr_b:"NEWS BELUX N9 NBR",  fmt_b:"NEWS BELUX N9 FORMAT",  prix_b:"NEWS BELUX N9 PRIX",  crd_b:"NEWS BELUX N9 CREDIT",  tot_b:"NEWS BELUX N9 TOTAL",
   nbr_f:"NEWS FRANCE N9 NBR", fmt_f:"NEWS FRANCE N9 FORMAT", prix_f:"NEWS FRANCE N9 PRIX", crd_f:"NEWS FRANCE N9 CREDIT", tot_f:"NEWS FRANCE N9 TOTAL"},
];

const SEL={
  textes_recu:  ["—","Demandé","Reçu","Non reçu"],
  epreuves_recu:["—","Envoyé","Reçu","Bon à tirer","Correction à faire","OK"],
  coupons_recu: ["—","Reçu","Retourné"],
};

let agent="",edIdx=0,records=[];

// ── PIN ──────────────────────────────────────────────────────────────────────
let pinTries=0;
document.getElementById("pin-input").addEventListener("keydown",e=>{if(e.key==="Enter")checkPin();});
function checkPin(){
  const v=document.getElementById("pin-input").value.trim();
  document.getElementById("pin-err").textContent="";
  if(v.length!==4||!/^\d{4}$/.test(v)){document.getElementById("pin-err").textContent="Code invalide — 4 chiffres requis";return;}
  if(AGENTS[v]){
    agent=AGENTS[v];
    document.getElementById("pin-overlay").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("agent-badge").textContent="Agent : "+agent;
    buildTabs();loadData();
  }else{
    pinTries++;
    document.getElementById("pin-tries").textContent=Math.min(pinTries+1,3);
    if(pinTries>=3){document.getElementById("pin-err").textContent="3 tentatives échouées — rechargez la page";document.getElementById("pin-btn").disabled=true;document.getElementById("pin-input").disabled=true;}
    else{document.getElementById("pin-err").textContent=`Code incorrect — tentative ${pinTries}/3`;document.getElementById("pin-input").value="";}
  }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function buildTabs(){
  document.getElementById("tabs").innerHTML=EDITIONS.map((e,i)=>
    `<div class="tab${i===0?" active":""}" style="${i===0?"background:#6E3FA3;color:#fff":""}" onclick="switchTab(${i})">${e.num}</div>`).join("");
}
function switchTab(i){
  edIdx=i;
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",i===j));
  buildTable();
}

// ── API ────────────────────────────────────────────────────────────────────────
function hdrs(){return{Authorization:"Bearer "+TK,"Content-Type":"application/json"};}
async function loadData(){
  showOv("⟳ Chargement depuis Airtable…");
  await new Promise(r=>setTimeout(r,60)); // force repaint avant fetch
  status("⟳ Chargement depuis Airtable…");
  records=[];let offset=null;
  do{
    const url=`https://api.airtable.com/v0/${BASE}/${TABLE_ID}?pageSize=100`+(offset?`&offset=${offset}`:"");
    const d=await fetch(url,{headers:hdrs()}).then(r=>r.json());
    records.push(...(d.records||[]));offset=d.offset||null;
  }while(offset);
  hideOv();
  status(`✅ ${records.length} membres chargés — ${new Date().toLocaleTimeString()}`);
  buildTable();
}

const timers={};
const pending={};

async function saveAll(){
  const items=Object.values(pending);
  Object.keys(timers).forEach(k=>{clearTimeout(timers[k]);delete timers[k];});
  Object.keys(pending).forEach(k=>delete pending[k]);
  if(!items.length){status("✅ Tout est déjà enregistré");return;}
  const merge={};
  for(const {recId,svKey,key,val} of items){
    const rec=records.find(r=>r.id===recId);if(!rec)continue;
    if(!merge[recId]){try{merge[recId]=JSON.parse(rec.fields[SF]||"{}");}catch{merge[recId]={};}}
    if(!merge[recId][svKey])merge[recId][svKey]={};
    merge[recId][svKey][key]=val;
  }
  const ids=Object.keys(merge);
  if(!ids.length){status("✅ Rien à enregistrer");return;}
  showOv(`💾 Enregistrement de ${ids.length} fiche(s)…`);
  await new Promise(r=>setTimeout(r,60));
  let ok=0,err=0;
  for(const recId of ids){
    const rec=records.find(r=>r.id===recId);if(!rec)continue;
    rec.fields[SF]=JSON.stringify(merge[recId]);
    try{
      await fetch(`https://api.airtable.com/v0/${BASE}/${TABLE_ID}/${recId}`,{method:"PATCH",headers:hdrs(),body:JSON.stringify({fields:{[SF]:JSON.stringify(merge[recId])}})});
      ok++;
    }catch{err++;}
  }
  hideOv();
  status(`✅ ${ok} enregistré(s)${err?` — ❌ ${err} erreur(s)`:""}  — ${new Date().toLocaleTimeString()}`);
}

async function saveSuivi(recId,svKey,key,val){
  const rec=records.find(r=>r.id===recId);if(!rec)return;
  let all={};try{all=JSON.parse(rec.fields[SF]||"{}");}catch{}
  if(!all[svKey])all[svKey]={};
  all[svKey][key]=val;rec.fields[SF]=JSON.stringify(all);
  showOv("💾 Sauvegarde en cours…");
  await new Promise(r=>setTimeout(r,60)); // force repaint avant fetch
  status("💾 Sauvegarde…");
  try{
    await fetch(`https://api.airtable.com/v0/${BASE}/${TABLE_ID}/${recId}`,{
      method:"PATCH",headers:hdrs(),body:JSON.stringify({fields:{[SF]:JSON.stringify(all)}})
    });
    hideOv();
    status("✅ Sauvegardé — "+new Date().toLocaleTimeString());
  }catch(e){hideOv();status("❌ Erreur : "+e.message);}
}
function db(recId,svKey,key,val){
  const tk=recId+svKey+key;
  pending[tk]={recId,svKey,key,val};
  clearTimeout(timers[tk]);
  timers[tk]=setTimeout(()=>{delete pending[tk];saveSuivi(recId,svKey,key,val);},600);
}

// ── HELPERS ────────────────────────────────────────────────────────────────────
function isChk(f,k){const v=f[k];if(v==null)return false;if(typeof v==="boolean")return v;return["OUI","TRUE","1","YES"].includes(String(v).trim().toUpperCase());}
function num(v){if(v==null||v==="")return"";const n=parseFloat(v);return isNaN(n)?"":n;}
function nrm(s){return(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();}
function getSv(rec,svKey){try{return JSON.parse(rec.fields[SF]||"{}")[svKey]||{};}catch{return{};}}

function selHtml(rid,svKey,k,cur,opts){
  return`<select onchange="db('${rid}','${svKey}','${k}',this.value)">`+
    opts.map(o=>`<option${(cur||"—")===o?" selected":""}>${o}</option>`).join("")+"</select>";
}
function dateHtml(rid,svKey,k,cur){return`<input type="date" value="${cur||""}" onchange="db('${rid}','${svKey}','${k}',this.value)">`;}
function txtHtml(rid,svKey,k,cur){return`<input type="text" value="${(cur||"").replace(/"/g,"&quot;")}" placeholder="Remarques…" onchange="db('${rid}','${svKey}','${k}',this.value)">`;}

// ── SECTION TABLE ──────────────────────────────────────────────────────────────
function buildSection(ed, section){
  const isBelux=section==="BELUX";
  const cbField=isBelux?ed.cb_b:ed.cb_f;
  const nbrF=isBelux?ed.nbr_b:ed.nbr_f, fmtF=isBelux?ed.fmt_b:ed.fmt_f;
  const prixF=isBelux?ed.prix_b:ed.prix_f, crdF=isBelux?ed.crd_b:ed.crd_f, totF=isBelux?ed.tot_b:ed.tot_f;
  const svKey=`${ed.label}|${section}`;
  const hdrBg=isBelux?"#6E3FA3":"#A67BC4";

  const seen=new Set();
  const members=records.filter(r=>{
    if(!isChk(r.fields,cbField))return false;
    const nm=nrm(r.fields["Enseigne commerciale"]||r.fields["NOM ATTRACTION"]||"");
    if(seen.has(nm))return false;seen.add(nm);return true;
  }).sort((a,b)=>nrm(a.fields["Enseigne commerciale"]||a.fields["NOM ATTRACTION"]||"")
                  .localeCompare(nrm(b.fields["Enseigne commerciale"]||b.fields["NOM ATTRACTION"]||"")));

  if(!members.length)return`<p style="color:#aaa;font-style:italic;padding:4px 0 12px">Aucun annonceur ${section}</p>`;

  let tNbr=0,tPrix=0,tCrd=0,tTot=0;
  const rows=members.map((rec,idx)=>{
    const f=rec.fields;
    const nom=f["Enseigne commerciale"]||f["NOM ATTRACTION"]||"—";
    const chk=isChk(f,cbField)?"✓":"";
    const nbr=num(f[nbrF]),fmt=f[fmtF]||"",prix=num(f[prixF]),crd=num(f[crdF]),tot=num(f[totF]);
    if(nbr!=="")tNbr+=parseFloat(nbr)||0;
    if(prix!=="")tPrix+=parseFloat(prix)||0;
    if(crd!=="")tCrd+=parseFloat(crd)||0;
    if(tot!=="")tTot+=parseFloat(tot)||0;
    const s=getSv(rec,svKey);const rid=rec.id;
    return`<tr>
      <td class="num">${idx+1}</td>
      <td class="nm" title="${nom}">${nom}</td>
      <td class="num" style="color:green;font-weight:bold">${chk}</td>
      <td class="num">${nbr}</td>
      <td class="num">${fmt}</td>
      <td class="right">${prix}</td>
      <td class="right">${crd}</td>
      <td class="right">${tot}</td>
      <td class="suivi">${dateHtml(rid,svKey,"textes_env",s.textes_env)}</td>
      <td class="suivi">${selHtml(rid,svKey,"textes_recu",s.textes_recu,SEL.textes_recu)}</td>
      <td class="suivi">${dateHtml(rid,svKey,"epreuves_env",s.epreuves_env)}</td>
      <td class="suivi">${selHtml(rid,svKey,"epreuves_recu",s.epreuves_recu,SEL.epreuves_recu)}</td>
      <td class="suivi">${dateHtml(rid,svKey,"coupons_env",s.coupons_env)}</td>
      <td class="suivi">${selHtml(rid,svKey,"coupons_recu",s.coupons_recu,SEL.coupons_recu)}</td>
      <td class="suivi">${txtHtml(rid,svKey,"remarques",s.remarques)}</td>
    </tr>`;
  }).join("");
  const fN=n=>n?n.toLocaleString("fr-BE"):"";
  return`<table>
    <thead>
      <tr>
        <th rowspan="2" style="width:28px;background:${hdrBg}">N°</th>
        <th rowspan="2" style="min-width:150px;background:${hdrBg}">ANNONCEUR</th>
        <th rowspan="2" style="background:${hdrBg}">✓</th>
        <th rowspan="2" style="background:${hdrBg}">Nbr</th>
        <th rowspan="2" style="background:${hdrBg}">Format</th>
        <th rowspan="2" style="background:${hdrBg}">Prix</th>
        <th rowspan="2" style="background:${hdrBg}">Crédit</th>
        <th rowspan="2" style="background:${hdrBg}">Total</th>
        <th colspan="2" class="sv-textes">TEXTES + PHOTOS</th>
        <th colspan="2" class="sv-epreuve">ÉPREUVES</th>
        <th colspan="2" class="sv-coupon">COUPONS</th>
        <th class="sv-rem" rowspan="2" style="min-width:110px">REMARQUES</th>
      </tr>
      <tr>
        <th class="sv-textes">Env.</th><th class="sv-textes">Reçu</th>
        <th class="sv-epreuve">Env.</th><th class="sv-epreuve">Reçu</th>
        <th class="sv-coupon">Env.</th><th class="sv-coupon">Reçu</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
    <tfoot>
      <tr style="background:${hdrBg}!important">
        <td colspan="3" style="background:${hdrBg};color:#fff">TOTAL : ${members.length} annonceur${members.length>1?"s":""}</td>
        <td class="num" style="background:${hdrBg};color:#fff">${fN(tNbr)}</td>
        <td style="background:${hdrBg}"></td>
        <td class="right" style="background:${hdrBg};color:#fff">${fN(tPrix)}</td>
        <td class="right" style="background:${hdrBg};color:#fff">${fN(tCrd)}</td>
        <td class="right" style="background:${hdrBg};color:#fff">${fN(tTot)}</td>
        <td colspan="7" style="background:${hdrBg}"></td>
      </tr>
    </tfoot>
  </table>`;
}

// ── MAIN TABLE ────────────────────────────────────────────────────────────────
function buildTable(){
  const ed=EDITIONS[edIdx];
  const belux=buildSection(ed,"BELUX");
  const france=buildSection(ed,"FRANCE");
  document.getElementById("content").innerHTML=`
    <h2 style="color:${ed.color}">NEWS SCOLAIRES ${ed.num} — ${ed.periode} — Généré le ${new Date().toLocaleDateString("fr-BE")}</h2>
    <h3 style="color:${ed.color}">▶ NEWS SCOLAIRES ${ed.num} — BELUX</h3>
    ${belux}
    <h3 style="color:#A67BC4;margin-top:14px">▶ NEWS SCOLAIRES ${ed.num} — FRANCE</h3>
    ${france}`;
}

function status(msg){document.getElementById("status").textContent=msg;}
function showOv(msg){
  document.getElementById("msg-box").textContent=msg;
  try{document.getElementById("loading-dialog").showModal();}catch(e){}
}
